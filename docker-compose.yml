services:
  dashboard:
    build:
      context: .
    image: vas-dashboard:local
    ports:
      - "8080:8080"
    environment:
      # Development serves the mock data. The web app still signs in with Entra ID, so put the
      # Entra IDs in .env (see .env.example); with the placeholders the sign-in cannot succeed.
      ASPNETCORE_ENVIRONMENT: Development
    env_file:
      - path: .env
        required: false
