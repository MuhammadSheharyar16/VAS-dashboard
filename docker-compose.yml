services:
  dashboard:
    build:
      context: .
      args:
        # Local only: the web app shows fixtures and a sample user, so no Entra tenant is needed.
        # A deployed image is built without this argument and always signs in for real.
        VITE_USE_MOCK: "true"
    image: vas-dashboard:local
    ports:
      - "8080:8080"
    environment:
      # Development allows the placeholder Entra IDs, so the container starts without a tenant.
      ASPNETCORE_ENVIRONMENT: Development
    env_file:
      - path: .env
        required: false
