name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VasDashboard.slnx

      - name: Build
        run: dotnet build VasDashboard.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test VasDashboard.slnx --configuration Release --no-build

      - name: Check for vulnerable packages
        run: |
          dotnet list VasDashboard.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found."
            exit 1
          fi

  frontend:
    name: Frontend lint, build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: /api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and production build
        run: npm run build

      - name: Unit and component tests
        run: npm test

      - name: Integration tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:integration

      - name: Check for vulnerable packages
        run: npm audit --audit-level=high

  image:
    name: Container image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag vas-dashboard:${{ github.sha }} .

      - name: Start the container and check health
        run: |
          docker run --detach --name dashboard --publish 8080:8080 \
            --env ASPNETCORE_ENVIRONMENT=Development vas-dashboard:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/healthz; then
              # The web app must be served from the same origin.
              curl --silent --fail http://localhost:8080/ | grep -q '<div id="root">' && exit 0
              echo "::error::The image does not serve the web app."
              exit 1
            fi
            sleep 1
          done
          docker logs dashboard
          exit 1
